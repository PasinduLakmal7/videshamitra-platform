[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "videshamitra-backend"
version = "0.1.0"
description = "VideshaMitra Backend - FastAPI & LangGraph Multi-Agent AI Safety Companion"
authors = [{ name = "Team QuadNova" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.0.30",
    "langchain>=0.1.13",
    "langchain-core>=0.1.33",
    "langchain-google-genai>=1.0.1",
    "supabase>=2.3.0",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
]
