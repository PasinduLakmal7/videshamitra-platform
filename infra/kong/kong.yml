_format_version: "3.0"

services:
  - name: videshamitra-backend
    url: http://web-backend:8000
    routes:
      - name: backend-api
        paths:
          - /api/v1
        strip_path: false
      - name: backend-health
        paths:
          - /health
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: local
      - name: cors
        config:
          origins:
            - http://localhost:5173
            - http://localhost:5174
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
          max_age: 3600
