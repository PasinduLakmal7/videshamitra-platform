# Docker Compose — core platform (local)
#
# Local Supabase (Postgres/Auth/Storage) runs outside Compose via the Supabase
# CLI on ports 54321/54322. Compose runs core-api, its worker, ai-service,
# notification-service and its worker, Redis and Kong.
#
# ai-service and notification-service run on the `internal` network only;
# neither publishes host ports. Requires ENVIRONMENT and INTERNAL_JWT_SECRET in
# the root .env.
#
#   supabase start
#   psql "postgresql://postgres:postgres@localhost:54322/postgres" -f supabase/bootstrap.sql
#   services/core-api/.venv/bin/python -m app.db.migrate
#   services/notification-service/.venv/bin/python -m app.db.migrate --dsn <admin-dsn>
#   docker compose up --build
#
# Kong is the only published entry point (http://localhost:8000).

services:
  redis:
    image: redis:7-alpine
    container_name: videshamitra-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
    restart: unless-stopped

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: videshamitra-core-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      SUPABASE_INTERNAL_URL: ${DOCKER_SUPABASE_INTERNAL_URL:-http://host.docker.internal:54321}
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8010
      NOTIFICATION_SERVICE_URL: http://notification-service:8020
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET in .env (openssl rand -hex 32)}
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
      - internal

  core-api-worker:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: videshamitra-core-api-worker
    command: ["python", "-m", "app.workers.runner"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      SUPABASE_INTERNAL_URL: ${DOCKER_SUPABASE_INTERNAL_URL:-http://host.docker.internal:54321}
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8010
      NOTIFICATION_SERVICE_URL: http://notification-service:8020
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET in .env (openssl rand -hex 32)}
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      core-api:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: videshamitra-ai-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010"]
    # No env_file: ai-service must not receive core's Supabase keys.
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET in .env (openssl rand -hex 32)}
      CORE_API_URL: http://core-api:8000
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FINGERPRINT_PEPPER: ${FINGERPRINT_PEPPER:-}
    expose:
      - "8010"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: videshamitra-notification-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8020"]
    # No env_file: notification-service must not receive core's Supabase keys.
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DOCKER_NOTIFICATION_DATABASE_URL:?set DOCKER_NOTIFICATION_DATABASE_URL in .env (notification_service_role DSN)}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET in .env (openssl rand -hex 32)}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-stub}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v21.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-notification_generic}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
      QUIET_HOURS_TIMEZONE: ${QUIET_HOURS_TIMEZONE:-Asia/Colombo}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-6}
      DELIVERY_POLL_INTERVAL_SECONDS: ${DELIVERY_POLL_INTERVAL_SECONDS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8020"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/internal/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - internal
    restart: unless-stopped

  notification-worker:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: videshamitra-notification-worker
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DOCKER_NOTIFICATION_DATABASE_URL:?set DOCKER_NOTIFICATION_DATABASE_URL in .env (notification_service_role DSN)}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET in .env (openssl rand -hex 32)}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-stub}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v21.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-notification_generic}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
      QUIET_HOURS_TIMEZONE: ${QUIET_HOURS_TIMEZONE:-Asia/Colombo}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-6}
      DELIVERY_POLL_INTERVAL_SECONDS: ${DELIVERY_POLL_INTERVAL_SECONDS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  kong:
    image: kong:3.9
    container_name: videshamitra-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./infra/kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped

volumes:
  redis-data:

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
