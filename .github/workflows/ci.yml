name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  ENVIRONMENT: test

permissions:
  contents: read

jobs:
  core-api:
    name: core-api lint, tests, contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/core-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov respx ruff

      - name: Lint
        run: ruff check app scripts tests

      - name: Format check
        run: ruff format --check app scripts tests

      - name: Unit and contract tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          INTERNAL_JWT_SECRET: ci-internal-secret-at-least-32-characters
        run: pytest -q --cov=app --cov-report=term-missing

      - name: OpenAPI contract is current
        run: python scripts/export_openapi.py --check

      - name: Event schemas are current
        run: python scripts/export_contracts.py --check

  ai-service:
    name: ai-service lint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/ai-service/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests
        env:
          INTERNAL_JWT_SECRET: ci-internal-secret-at-least-32-characters
        run: pytest -q

  notification-service:
    name: notification-service lint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/notification-service/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit and contract tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          INTERNAL_JWT_SECRET: ci-internal-secret-at-least-32-characters
          ENVIRONMENT: test
          PUSH_PROVIDER: stub
          WHATSAPP_ENABLED: "false"
        run: pytest -q

  notification-migrations:
    name: notification migrations and integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: videshamitra_notification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/notification-service/requirements*.txt
      - name: Install dependencies
        working-directory: services/notification-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Apply migrations twice
        working-directory: services/notification-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videshamitra_notification
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videshamitra_notification
          INTERNAL_JWT_SECRET: ci-internal-secret-at-least-32-characters
          ENVIRONMENT: test
        run: |
          python -m app.db.migrate
          python -m app.db.migrate
      - name: Integration tests
        working-directory: services/notification-service
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videshamitra_notification
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videshamitra_notification
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videshamitra_notification
          INTERNAL_JWT_SECRET: ci-internal-secret-at-least-32-characters
          ENVIRONMENT: test
          PUSH_PROVIDER: stub
          WHATSAPP_ENABLED: "false"
        run: pytest -q tests/integration

  migrations:
    name: migrations from empty Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: videshamitra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/core-api/requirements.txt
      - name: Install dependencies
        working-directory: services/core-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Bootstrap schema and roles
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/videshamitra_test" \
            -f supabase/bootstrap.sql
      - name: Apply migrations
        working-directory: services/core-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videshamitra_test
          INTERNAL_JWT_SECRET: ci-internal-secret-at-least-32-characters
        run: |
          python -m app.db.migrate
          python -m app.db.migrate
      - name: Migration integration test
        working-directory: services/core-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videshamitra_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videshamitra_test
          INTERNAL_JWT_SECRET: ci-internal-secret-at-least-32-characters
        run: pytest -q tests/integration

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build core-api image
        run: docker build services/core-api
      - name: Build ai-service image
        run: docker build services/ai-service
      - name: Build notification-service image
        run: docker build services/notification-service
      - name: Build admin image
        run: docker build admin-frontend
      - name: Build worker web image
        run: docker build web-frontend

  frontends:
    name: admin + worker web lint/build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Admin frontend
        working-directory: admin-frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm run generate:api
          git diff --exit-code -- src/types/api.generated.ts
      - name: Worker web
        working-directory: web-frontend
        run: |
          npm ci
          npm run build
